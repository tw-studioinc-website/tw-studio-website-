:root{color-scheme:light dark;--bg:#f4f3ef;--surface:#fff;--ink:#161714;--muted:#666861;--line:#cecec7;--accent:#c36b37;--accent-ink:#fffaf6;--hero:#fff;--header:rgba(244,243,239,.92);--image:#deded8;--pad:clamp(20px,4.1vw,70px);--body:"DM Sans",sans-serif;--display:"Manrope",sans-serif}

/* ---- Projects page: SWA-style overlay tiles, wide/short, 2 per row ---- */
.projects-grid{grid-template-columns:1fr 1fr;gap:4px;padding-left:0;padding-right:0;padding-bottom:clamp(90px,12vw,170px)}
.project-card{grid-column:auto;position:relative;overflow:hidden;background:#111;border-radius:0;text-align:left}
/* override original editorial nth-child layout (higher specificity) */
.project-card:nth-child(n){grid-column:auto;margin-top:0}
.project-card:nth-child(n) .project-image{aspect-ratio:16/5}
.project-card .project-image{aspect-ratio:16/5}
.project-card .project-image img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.001);transition:transform .8s cubic-bezier(.2,.6,.2,1)}
.project-card:hover .project-image img{transform:scale(1.045)}
.project-card .project-meta{position:absolute;left:0;right:0;bottom:0;z-index:2;margin:0;padding:72px 28px 26px;text-align:right;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,0) 100%)}
.project-card .project-meta h3{color:#fff;font-size:clamp(24px,3vw,40px);font-weight:700;letter-spacing:-.015em;margin:0;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.project-card .project-meta p{color:rgba(255,255,255,.92);font-size:13px;letter-spacing:.02em;margin:8px 0 0;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.page-hero{height:min(54vh,560px);min-height:380px}
.page-hero .hero-copy h1{margin:0 0 14px}
.page-hero .hero-copy p{max-width:640px;color:rgba(255,255,255,.92);font-size:17px;line-height:1.65;margin:0}
/* projects intro text + filter spacing */
.projects-intro{padding:clamp(64px,9vw,130px) var(--pad) 0}
.projects-intro h2{font:500 clamp(26px,3.4vw,44px)/1.15 var(--display);letter-spacing:-.02em;margin:0 0 18px;max-width:820px}
.projects-intro p{color:var(--muted);font-size:clamp(15px,1.6vw,18px);line-height:1.75;max-width:660px;margin:0}
.filters{padding-top:clamp(38px,5vw,68px);padding-bottom:clamp(42px,5vw,76px)}
#mainNav a.active{color:var(--accent)}
@media(max-width:720px){.projects-grid{grid-template-columns:1fr}.project-card .project-meta h3{font-size:26px}}
</style>
